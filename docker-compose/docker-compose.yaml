name: eudi-verifier

networks:
  default:
    driver: bridge

services:
  verifier-backend:
    # No `build:` block here - Compose itself can't build this (it's Spring
    # Boot's own Cloud Native Buildpacks integration, `./gradlew
    # bootBuildImage`, not a Dockerfile - see ../../../build-images.sh). If
    # you've run that (or ../../../Makefile's `make images`) it produces
    # "build/eudi-srv-verifier-endpoint:latest" locally and re-tags it to
    # the name below. Otherwise, `docker compose up -d` pulls this tag from
    # GHCR - no `pull_policy: never` override anymore, since "not built
    # locally yet" is now the normal, successful case (see
    # ../../../push-images.sh and the top-level README's GHCR section), not
    # something to hard-refuse.
    image: ghcr.io/leo-sus-teq/eudi-verifier-backend:latest
    container_name: verifier-backend
    volumes:
      - ./verifier-backend/verifier-access.p12:/verifier-access.p12
    environment:
      - VERIFIER_PUBLICURL=${DEMO_SCHEME:-https}://${VERIFIER_HOST:-verifier.localhost}
      - VERIFIER_DEFAULTHTTPRESPONSEMODE=DirectPostJwt
      - VERIFIER_ACCESS_CERTIFICATE_KEYSTORE=file:/verifier-access.p12
      - VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_TYPE=pkcs12
      - VERIFIER_ACCESS_CERTIFICATE_KEYSTORE_PASSWORD=verifier
      - VERIFIER_ACCESS_CERTIFICATE_ALIAS=verifier-access
      - VERIFIER_ACCESS_CERTIFICATE_PASSWORD=verifier
      # Our verifier-access key is P-256, not the reference's default-assumed P-521.
      - VERIFIER_ACCESS_CERTIFICATE_SIGNING_ALGORITHM=ES256
      # Without these, verifier.clientIdPrefix defaults to "pre-registered", but the
      # UI's default profile is HAIP - which requires x509_hash specifically (backend
      # rejects every submission with HaipNotSupported.ClientIdPrefixX509HashMustBeUsed
      # otherwise). originalClientId must be the base64url(no-pad) SHA-256 hash of the
      # DER-encoded verifier-access.p12 leaf cert above, not the reference repo's
      # hardcoded value (that one's hash matches *its* demo keystore, not ours).
      # Recompute if verifier-access.p12 is ever regenerated:
      #   openssl pkcs12 -in verifier-access.p12 -nokeys -passin pass:verifier | \
      #     openssl x509 -outform DER | \
      #     openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '='
      - VERIFIER_CLIENTIDPREFIX=x509_hash
      - VERIFIER_ORIGINALCLIENTID=--DCsJhUKVx8wMVNS8PqB-1i6KdQT1GXyGxhr4vH35M
      - VERIFIER_ATTESTATIONCLASSIFICATIONS={"pid":{"vcts":["urn:eudi:pid:1"],"docTypes":["eu.europa.ec.eudi.pid.1"]},"qeaa":{"vcts":[],"docTypes":[]},"pubeaa":{"vcts":["urn:eudi:ehic:1","urn:eudi:residence.permit:1"],"docTypes":[]},"eaa":[{"useCase":"mDL","vcts":[],"docTypes":["org.iso.18013.5.1.mDL"]},{"useCase":"diploma","vcts":["urn:eu.europa.ec.eudi:learning:credential:1"],"docTypes":[]},{"useCase":"schufa","vcts":["urn:eudi:schufa:1"],"docTypes":["eudi.schufa.1"]},{"useCase":"arbeitsvertrag","vcts":["urn:eudi:trusteq.arbeitsvertrag:1"],"docTypes":["eudi.trusteq.arbeitsvertrag.1"]}]}
      # Required since v0.11.0: every /ui/presentations request must resolve either an
      # intended_use_id or an inline registration_certificate (VerifierConfig's
      # resolveRegistrationCertificate). Self-signed dev "registration certificate"
      # (rc-wrp+jwt) covering every attestation type this demo issues, carried over
      # unchanged from the prior in-repo setup (it's independent of the JAR-signing
      # access certificate above, so the new dedicated key doesn't affect it).
      - VERIFIER_INTENDEDUSES_0_ID=1
      - VERIFIER_INTENDEDUSES_0_DESCRIPTION=TRUSTEQ EUDI branded demo
      - VERIFIER_INTENDEDUSES_0_..9jOC1vSzcOPsujhGekwjxfci_lZe-dAF9tPo__QFG3-npsU7xjExPDeCKzeg1YQ4dhgCkz5UVcfPeBkKFvO5Ng
    networks:
      - default

  verifier-ui:
    build:
      context: ../../eudi-web-verifier
      dockerfile: Dockerfile
    # `docker compose up -d` pulls this from GHCR when no local image with
    # this exact tag exists yet (Compose's own default: pull first, build
    # from the `build:` block above only if that pull fails - see
    # ../../../push-images.sh and the top-level README's GHCR section).
    image: ghcr.io/leo-sus-teq/eudi-verifier-ui:latest
    container_name: verifier-ui
    environment:
      # Read by eudi-web-verifier's nginx envsubst-on-templates entrypoint
      # (nginx/templates/nginx.conf.template's sub_filter) - already a
      # working templating mechanism, just needed the value to stop being
      # a literal.
      - HOST_API=${DEMO_SCHEME:-https}://${VERIFIER_HOST:-verifier.localhost}
    networks:
      - default

  haproxy:
    image: haproxy:2.8.3
    container_name: verifier-haproxy
    # No host ports published: the demo gateway (../../eudi-gateway) is the
    # sole entry point now, reaching this on the docker network as
    # ${DEMO_SCHEME:-https}://${VERIFIER_HOST:-verifier.localhost}.
    depends_on:
      verifier-backend:
        condition: service_started
      verifier-ui:
        condition: service_started
    volumes:
      - ./haproxy/haproxy.conf:/usr/local/etc/haproxy/haproxy.cfg
      - ./haproxy/certs/:/etc/ssl/certs/
    # Bare passthrough, no default - see ../../../eudi-gateway/docker-compose.yaml's
    # comment on DEMO_TLS_DISABLED for why it must be truly absent (not
    # set-to-empty) when unset. Controls haproxy.conf's own `.if
    # defined(DEMO_TLS_DISABLED)` around this stack's :8443 bind.
    environment:
      - DEMO_TLS_DISABLED
    networks:
      - default

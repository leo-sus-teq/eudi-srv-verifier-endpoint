global
    maxconn 50000
    log stdout format raw local0
    user root
    group root
    nbthread 4
    cpu-map auto:1/1-4 0-3
    ssl-default-bind-options ssl-min-ver TLSv1.1

defaults
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    log global
    mode http
    option httplog
    maxconn 3000
    default_backend no-match

frontend verifier_all
.if defined(DEMO_TLS_DISABLED)
    # DEMO_TLS_DISABLED is only ever explicitly set (by demo-up.sh, when
    # DEMO_TLS_MODE=none/behind-proxy, or by an Azure Container Apps
    # deployment where this haproxy is only ever reached over plain HTTP
    # from Container Apps' own ingress one hop earlier) - absent by default,
    # so this bind stays exactly as it always has for anyone running
    # `docker compose up -d` directly without demo-up.sh. See the outer
    # gateway's own haproxy.conf (../../../eudi-gateway) for the same
    # pattern, and why it matters: without this, haproxy refuses to start at
    # all in an environment that never provisions
    # /etc/ssl/certs/localhost.tls.pem (this cert is genuinely never reached
    # today anyway - see the comment below).
.else
    bind 0.0.0.0:8443 ssl crt /etc/ssl/certs/localhost.tls.pem
.endif
    # Plain listener, internal-only: the demo gateway (../../eudi-gateway)
    # terminates TLS once for whatever VERIFIER_HOST is configured as (see
    # ../../../demo.env.example) and forwards here in plain HTTP - this
    # stack's own :8443 listener above is never actually reached by it.
    bind 0.0.0.0:8080
    use_backend verifier-backend if { path_beg /utilities/ }
    use_backend verifier-backend if { path_beg /ui/ }
    use_backend verifier-backend if { path_beg /wallet/ }
    default_backend verifier-ui

backend verifier-backend
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    server server1 verifier-backend:8080 cookie server1

backend verifier-ui
    balance roundrobin
    cookie SERVERUSED insert indirect nocache
    server server1 verifier-ui:4300 cookie server1

backend no-match
    http-request deny deny_status 404
